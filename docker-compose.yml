services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexushr-backend:1.2
    container_name: nexushr-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/postgres
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      NEXUSHR_JWT_SECRET: ${NEXUSHR_JWT_SECRET}
      NEXUSHR_JWT_EXPIRATION: ${NEXUSHR_JWT_EXPIRATION}
      NEXUSHR_JWT_REFRESH_EXPIRATION: ${NEXUSHR_JWT_REFRESH_EXPIRATION}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD}
      SERVER_ADDRESS: 0.0.0.0
    volumes:
      - nexushr_uploads:/app/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    image: nexushr-frontend:1.1
    container_name: nexushr-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  nexushr_uploads:
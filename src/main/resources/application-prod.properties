spring.application.name=nexus

# Production PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=${PORT:8080}
server.address=0.0.0.0

# JWT - retain existing application property names
nexushr.jwt.secret=${NEXUSHR_JWT_SECRET}
nexushr.jwt.expiration=86400000
nexushr.jwt.refresh-expiration=604800000

# Email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Document management
app.document.upload-dir=${DOCUMENT_UPLOAD_DIR:uploads/documents}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


spring.application.name=nexus

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8080

# JWT Configuration
nexushr.jwt.secret=${NEXUSHR_JWT_SECRET}
nexushr.jwt.expiration=${NEXUSHR_JWT_EXPIRATION:86400000}
nexushr.jwt.refresh-expiration=${NEXUSHR_JWT_REFRESH_EXPIRATION:604800000}

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000


# NexusHR Document Management
app.document.upload-dir=uploads/documents
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB



# Enable mobile access to the backend
server.address=0.0.0.0

# Frontend URL for password recovery
app.frontend-url=${FRONTEND_URL:http://localhost:5173}